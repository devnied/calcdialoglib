plugins {
    id "com.android.library"
    id "maven-publish"
}

ext {
    // Auto generate version code based on version name
    libVersionCode = libVersion.split(/\./).collect { it.padLeft(2, "0") }.sum().toInteger()
    allLicenses = [license]
}

android {
    namespace = "com.maltaisn.calcdialog"
    compileSdk = setup.compileSdk
    defaultConfig {
        minSdk = setup.minSdk
        targetSdk = setup.targetSdk
        versionCode = libVersionCode
        versionName = libVersion
        consumerProguardFiles "consumer-rules.pro"
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = project.findProperty("group") ?: "com.github.devnied"
                artifactId = "calcdialog"
                version = project.findProperty("version") ?: libVersion
            }
        }
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:$appCompatVersion"
    implementation "androidx.constraintlayout:constraintlayout:$constraintLayoutVersion"
    implementation "com.google.android.material:material:$materialVersion"

    testImplementation "junit:junit:$junitVersion"
}

tasks.withType(Javadoc).all { enabled = false }
